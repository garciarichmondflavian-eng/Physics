[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 9600
lib_ldf_mode = chain+
lib_deps =
    adafruit/RTClib
    arduino-libraries/SD
build_src_filter = -<*> +<rain_gauge_sms.cpp>

[env:esp8266]
platform = espressif8266
board = nodemcuv2          
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<esp8266_sms_gateway.cpp>